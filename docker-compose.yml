services:
  db:
    image: postgres:16-alpine
    container_name: claimgraph-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claimgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimgraph}
      POSTGRES_DB: ${POSTGRES_DB:-claimgraph}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-claimgraph} -d $${POSTGRES_DB:-claimgraph}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimgraph-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://claimgraph:claimgraph@db:5432/claimgraph}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      STORAGE_DIR: ${STORAGE_DIR:-/app/storage}
      LLM_EXTRACT_MODEL: ${LLM_EXTRACT_MODEL:-}
      LLM_CLASSIFY_MODEL: ${LLM_CLASSIFY_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./data:/data
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claimgraph-frontend
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
  storage_data:
